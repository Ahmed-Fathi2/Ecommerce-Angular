<section class="category-slider-section">
  <div class="slider-header">
    <div>
      <p class="slider-label">Explore Categories</p>
      <h2>Top Categories</h2>
    </div>

    @if (categories().length > 0) {
      <div class="slider-controls">
        <button 
          type="button" 
          class="slider-control" 
          (click)="prevSlide()" 
          [disabled]="currentIndex() === 0"
          aria-label="Previous Slide">
          &larr;
        </button>
        <button 
          type="button" 
          class="slider-control" 
          (click)="nextSlide()" 
          [disabled]="currentIndex() >= maxIndex()"
          aria-label="Next Slide">
          &rarr;
        </button>
      </div>
    }
  </div>

  <!-- @if (errorMessages().length > 0) {
    <div class="error-state">
      <div class="error-icon">⚠️</div>
      <ul class="error-list">
        @for (msg of errorMessages(); track msg) {
          <li>{{ msg }}</li>
        }
      </ul>
    </div>
  } -->

  @if (isLoading()) {
    <div class="empty-state">
      <p>Loading categories...</p>
    </div>
  } @else if (categories().length > 0) {
    <div class="slider-container">
      <div class="slider-track" [style.transform]="transformStyle()">
        @for (category of categories(); track category.id) {
          <div class="slider-item">
            <app-category-card [category]="category"></app-category-card>
          </div>
        }
      </div>
    </div>
  } @else {
    <div class="empty-state">
      <p>No categories available at the moment.</p>
    </div>
  }
</section>
