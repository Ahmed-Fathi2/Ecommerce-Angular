<div class="min-h-[75vh] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
  <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200/80 p-8 sm:p-10 shadow-xl text-center space-y-8 relative overflow-hidden">
    
    <!-- Decorative Ambient Glow -->
    <div class="absolute -top-16 -right-16 w-32 h-32 bg-emerald-100 rounded-full blur-2xl opacity-60 pointer-events-none"></div>
    <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-orange-100 rounded-full blur-2xl opacity-60 pointer-events-none"></div>

    <!-- Success Animated Badge -->
    <div class="relative flex justify-center">
      <div class="w-24 h-24 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center border-4 border-emerald-100 shadow-inner">
        <svg class="w-12 h-12 transform scale-100 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <span class="absolute top-0 right-1/3 flex h-3.5 w-3.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500"></span>
      </span>
    </div>

    <!-- Congratulations Header -->
    <div class="space-y-3">
      <span class="px-3.5 py-1 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-full border border-emerald-200/70 tracking-wide uppercase">
        Payment Verified
      </span>
      <p class="text-sm text-slate-500 leading-relaxed">
        Your payment was processed successfully. Thank you for your order! We are currently preparing your items for shipment.
      </p>
    </div>

    <!-- Order Info Summary Box -->
    <div class="bg-slate-50/80 border border-slate-100 rounded-2xl p-4 text-left space-y-2">
      <div class="flex items-center justify-between text-xs text-slate-500">
        <span>Payment Status</span>
        <span class="font-bold text-emerald-600 flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Completed
        </span>
      </div>
      <div class="flex items-center justify-between text-xs text-slate-500">
        <span>Delivery Method</span>
        <span class="font-medium text-slate-800">Standard Delivery</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-3 pt-2">
      <!-- Button to see orders -->
      <a routerLink="/orders" class="w-full py-3.5 px-6 bg-orange-600 hover:bg-orange-700 active:bg-orange-800 text-white font-bold rounded-xl shadow-lg shadow-orange-600/25 hover:shadow-orange-600/35 transition-all text-sm flex items-center justify-center gap-2 group cursor-pointer">
        <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
        <span>View My Orders</span>
      </a>

      <!-- Button to go home -->
      <a routerLink="/home" class="w-full py-3.5 px-6 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold rounded-xl transition-all text-sm flex items-center justify-center gap-2 cursor-pointer">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span>Back to Home</span>
      </a>
    </div>

  </div>
</div>
