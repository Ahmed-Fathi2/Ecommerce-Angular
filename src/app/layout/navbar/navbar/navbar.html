<header class="navbar-header">
  <div class="navbar-container">
    <div class="navbar-flex">

      <!-- Brand Logo -->
      <a routerLink="/" class="navbar-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 15"/>
          </svg>
        </div>
        <span class="brand-name">TimeCraft<span class="brand-dot">.</span></span>
      </a>

      @if (IsLoggedIn()) {
        <!-- Desktop Navigation Links -->
        <nav class="navbar-nav">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
          <a routerLink="/products" routerLinkActive="active" class="nav-link">Products</a>
          <a routerLink="/categories" routerLinkActive="active" class="nav-link">Categories</a>
          <a routerLink="/orders" routerLinkActive="active" class="nav-link">Orders</a>
        </nav>

        <!-- Search Bar (Desktop) -->
        <div class="navbar-search">
          <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" placeholder="Search luxury watches..." class="search-input" />
        </div>
      }

      <!-- Actions (Cart, Auth, Mobile toggle) -->
      <div class="navbar-actions">

        @if (IsLoggedIn()) {
          <!-- Cart Button -->
          <button routerLink="/cart" type="button" class="cart-btn" aria-label="Shopping Cart">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <span class="cart-badge">{{cartService.cartItemsCount()}}</span>
          </button>
        }

        <!-- Auth Links -->
        <div class="auth-buttons">
          @if (!IsLoggedIn()) {
            <a routerLink="/login" class="btn-login">Login</a>
            <a routerLink="/register" class="btn-register">Register</a>
          } @else {
            <a (click)="logout()" routerLink="/login" class="btn-logout">Logout</a>
          }
        </div>

        <!-- Mobile Menu Toggle Button -->
        <button (click)="toggleMobileMenu()" type="button" class="mobile-toggle" aria-label="Toggle navigation menu">
          @if (!isMobileMenuOpen()) {
            <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          } @else {
            <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Navigation -->
  @if (isMobileMenuOpen()) {
    <div class="mobile-menu">
      @if (IsLoggedIn()) {
        <div class="navbar-search" style="max-width: 100%; margin-bottom: 1rem;">
          <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" placeholder="Search luxury watches..." class="search-input" />
        </div>

        <nav class="mobile-nav">
          <a (click)="isMobileMenuOpen.set(false)" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
          <a (click)="isMobileMenuOpen.set(false)" routerLink="/products" routerLinkActive="active">Products</a>
          <a (click)="isMobileMenuOpen.set(false)" routerLink="/categories" routerLinkActive="active">Categories</a>
          <a (click)="isMobileMenuOpen.set(false)" routerLink="/orders" routerLinkActive="active">Orders</a>
        </nav>
      }

      <div class="mobile-auth">
        @if (!IsLoggedIn()) {
          <a (click)="isMobileMenuOpen.set(false)" routerLink="/login" class="btn-login">Login</a>
          <a (click)="isMobileMenuOpen.set(false)" routerLink="/register" class="btn-register">Register</a>
        } @else {
          <a (click)="isMobileMenuOpen.set(false)" (click)="logout()" routerLink="/login" class="btn-logout">Logout</a>
        }
      </div>
    </div>
  }
</header>
