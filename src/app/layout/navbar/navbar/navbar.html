<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-4">

      <!-- Brand Logo -->
      <div class="flex items-center gap-2">
        <a routerLink="/"
          class="flex items-center gap-2 text-xl font-bold text-slate-900 hover:opacity-90 transition-opacity">
          <div
            class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
            <svg class="w-5 h-5" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
          </div>
          <span
            class="tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Ecom</span>
        </a>
      </div>
@if(loginService.userData()!==null) {
      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
        <a routerLink="/" routerLinkActive="text-blue-600 font-semibold" [routerLinkActiveOptions]="{exact: true}"
          class="hover:text-blue-600 transition-colors">Home</a>
        <a routerLink="/products" routerLinkActive="text-blue-600 font-semibold"
          class="hover:text-blue-600 transition-colors">Products</a>
        <a routerLink="/categories" routerLinkActive="text-blue-600 font-semibold"
          class="hover:text-blue-600 transition-colors">Categories</a>
        <a routerLink="/deals" routerLinkActive="text-blue-600 font-semibold"
          class="hover:text-blue-600 transition-colors">Deals</a>
      </nav>
      <!-- Search Bar (Desktop) -->
      <div class="hidden lg:flex items-center flex-1 max-w-xs mx-4">
        <div class="relative w-full">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
            <svg class="w-4 h-4" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </span>
          <input type="text" placeholder="Search products..."
            class="w-full pl-9 pr-4 py-2 text-sm bg-slate-100/80 border border-transparent rounded-lg focus:bg-white focus:border-blue-500 focus:outline-none transition-all placeholder:text-slate-400" />
        </div>
      </div>
    }

      <!-- Actions (Cart, Auth, Mobile toggle) -->
      <div class="flex items-center gap-3 sm:gap-4">

        <!-- Cart Button -->
          @if(loginService.userData()!==null) {
        <button type="button"
          class="relative p-2 text-slate-600 hover:text-blue-600 hover:bg-slate-100 rounded-lg transition-colors"
          aria-label="Shopping Cart">
          <svg class="w-6 h-6" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span
            class="absolute top-1 right-1 flex items-center justify-center w-4 h-4 text-[10px] font-bold text-white bg-blue-600 rounded-full">3</span>
        </button>
      }
        <!-- Auth Links -->
        <div class="hidden sm:flex items-center gap-2 header-actions">

          @if(loginService.userData()===null) {
          <a routerLink="/login" routerLinkActive="bg-slate-100"
            class="px-4 py-2 text-sm font-medium text-slate-700 hover:text-blue-600 hover:bg-slate-100 rounded-lg transition-colors">Login</a>
          <a routerLink="/register"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-xs transition-colors">Register</a>
          } @else {
          <a (click)="logout()" routerLink="/login"
            class="px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:text-blue-600 hover:bg-slate-200 rounded-lg transition-colors">Logout</a>
          }
        </div>

        <!-- Mobile Menu Button -->
        <button (click)="toggleMobileMenu()" type="button"
          class="md:hidden p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors"
          aria-label="Toggle navigation menu">
          @if (!isMobileMenuOpen()) {
          <svg class="w-6 h-6" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          } @else {
          <svg class="w-6 h-6" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Navigation -->
  @if (isMobileMenuOpen()) {
  <div class="md:hidden border-t border-slate-200/80 bg-white px-4 pt-3 pb-6 space-y-3">
    <!-- Search Input Mobile -->
    <div class="relative w-full mb-3">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
        <svg class="w-4 h-4" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </span>
      <input type="text" placeholder="Search products..."
        class="w-full pl-9 pr-4 py-2 text-sm bg-slate-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <nav class="flex flex-col space-y-1">
      <a (click)="isMobileMenuOpen.set(false)" routerLink="/" routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
        [routerLinkActiveOptions]="{exact: true}"
        class="px-3 py-2 text-base font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">Home</a>
      <a (click)="isMobileMenuOpen.set(false)" routerLink="/products"
        routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
        class="px-3 py-2 text-base font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">Products</a>
      <a (click)="isMobileMenuOpen.set(false)" routerLink="/categories"
        routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
        class="px-3 py-2 text-base font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">Categories</a>
      <a (click)="isMobileMenuOpen.set(false)" routerLink="/deals"
        routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
        class="px-3 py-2 text-base font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">Deals</a>
    </nav>

    <div class="pt-3 border-t border-slate-100 flex flex-col gap-2">
      <a (click)="isMobileMenuOpen.set(false)" routerLink="/login"
        class="w-full text-center px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">Login</a>
      <a (click)="isMobileMenuOpen.set(false)" routerLink="/register"
        class="w-full text-center px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">Register</a>
      <a (click)="isMobileMenuOpen.set(false)" routerLink="/login"
        class="w-full text-center px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">Logout</a>
    </div>
  </div>
  }
</header>
