<div class="p-4 sm:p-6 transition-colors hover:bg-slate-50/50">
  <div class="flex flex-col sm:grid sm:grid-cols-12 gap-4 items-center">
    
    <!-- Product Image & Name -->
    <div class="sm:col-span-6 flex items-center gap-4 w-full">
      <div class="w-20 h-20 sm:w-24 sm:h-24 bg-slate-50 rounded-2xl overflow-hidden border border-slate-200/60 shrink-0 flex items-center justify-center p-1">
        @if (item.imageUrl) {
          <img [src]="item.imageUrl" [alt]="item.productName" class="w-full h-full object-cover object-center rounded-xl" />
        } @else {
          <div class="text-slate-300">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
        }
      </div>
      <div class="min-w-0 flex-1">
        <h3 class="text-base font-semibold text-slate-900 line-clamp-2" [title]="item.productName">
          {{ item.productName }}
        </h3>
        
        <!-- Remove Button Visual Only -->
        <button (click)="removeItem()" type="button" class="mt-2 text-xs font-medium text-rose-500 hover:text-rose-600 transition-colors inline-flex items-center gap-1.5 py-0.5">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span>Remove</span>
        </button>
      </div>
    </div>

    <!-- Unit Price -->
    <div class="sm:col-span-2 flex sm:flex-col justify-between sm:justify-center items-center w-full sm:w-auto text-sm">
      <span class="sm:hidden text-slate-500 font-medium">Unit Price:</span>
      <span class="font-semibold text-slate-700">${{ item.unitPrice }}</span>
    </div>

    <!-- Quantity Controls (Visual only) -->
    <div class="sm:col-span-2 flex sm:flex-col justify-between sm:justify-center items-center w-full sm:w-auto">
      <span class="sm:hidden text-slate-500 font-medium text-sm">Quantity:</span>
      <div class="inline-flex items-center border border-slate-200 rounded-xl bg-slate-50/80 p-1">
        <button type="button" class="w-7 h-7 flex items-center justify-center text-slate-600 hover:text-slate-900 bg-white rounded-lg shadow-2xs border border-slate-200/80 transition-all hover:scale-105 active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
          </svg>
        </button>
        <span class="w-9 text-center font-bold text-slate-800 text-sm">
          {{ item.quantity }}
        </span>
        <button type="button" class="w-7 h-7 flex items-center justify-center text-slate-600 hover:text-slate-900 bg-white rounded-lg shadow-2xs border border-slate-200/80 transition-all hover:scale-105 active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Total Price -->
    <div class="sm:col-span-2 flex sm:flex-col justify-between sm:justify-center items-end w-full sm:w-auto text-right">
      <span class="sm:hidden text-slate-500 font-medium text-sm">Total:</span>
      <span class="text-base font-extrabold text-orange-600">
        ${{ item.totalPrice }}
      </span>
    </div>

  </div>
</div>
